name: 🧪 WebdriverIO Tests with Allure

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install --legacy-peer-deps

      - name: 🧠 Rodar testes WebdriverIO
        run: npx wdio run ./wdio.conf.ts
        working-directory: .

      - name: 📊 Gerar relatório Allure
        run: npx allure-commandline generate ./allure-results --clean -o ./allure-report
        working-directory: qa.automationexercise-web.webdriverio

      - name: 📂 Upload do relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: 🧭 Publicar Allure Report como página
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
